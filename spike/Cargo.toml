[package]
name = "spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "S1 spike: probe a live local model's agentic behaviour. Throwaway code; sse.rs moves into immortality-llm."

[dependencies]
anyhow = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "io-util", "sync"] }
