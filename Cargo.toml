[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/llm",
    "crates/tools",
    "crates/daemon",
    "crates/cli",
    "crates/testkit",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OWNER/immortality"
authors = ["immortality contributors"]

[workspace.dependencies]
# Internal path dependencies carry the workspace version explicitly. Without it cargo-deny
# sees a `*` requirement and reports a wildcard dependency, which would be denied in CI for
# no reason; the version is irrelevant at runtime because none of these are published.
immortality-core = { path = "crates/core", version = "0.0.0" }
immortality-llm = { path = "crates/llm", version = "0.0.0" }
immortality-tools = { path = "crates/tools", version = "0.0.0" }
immortality-daemon = { path = "crates/daemon", version = "0.0.0" }
immortality-testkit = { path = "crates/testkit", version = "0.0.0" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "io-util", "sync", "signal", "net", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
getrandom = "0.4"
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tempfile = "3"
proptest = "1"
insta = { version = "1", features = ["json"] }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
# Counting newlines in a test fixture: pulling in `bytecount` for that would be absurd.
naive_bytecount = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
